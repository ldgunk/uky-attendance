<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아멘교회 UKY 청년부</title>
  <script>
    var APP = 'https://script.google.com/macros/s/AKfycbzJIf2dMdNk9EcsHlEySYNJ5UZm7DIS-yIagStZI68q2n-s3f9yy3CKECHUlmvjUm0f/exec';
    var ua = navigator.userAgent || '';
    if (/KAKAOTALK/i.test(ua)) {
      /* 카카오톡 인앱 브라우저 → 기본 브라우저(Safari/Chrome)로 열기 */
      if (/Android/i.test(ua)) {
        location.href = 'intent://' + APP.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
      } else {
        location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(APP);
      }
    } else {
      location.replace(APP);
    }
  </script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:48px 16px">
  <p>앱으로 이동 중이에요…</p>
  <p><a href="https://script.google.com/macros/s/AKfycbzJIf2dMdNk9EcsHlEySYNJ5UZm7DIS-yIagStZI68q2n-s3f9yy3CKECHUlmvjUm0f/exec">자동으로 안 넘어가면 여기를 눌러 주세요</a></p>
  <p style="color:#888;font-size:13px">카카오톡에서 열었다면 오른쪽 아래 공유 버튼 → Safari로 열기를 눌러 주세요.</p>
</body>
</html>
